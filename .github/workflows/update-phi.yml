name: Update Phi Formula

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for version change on main
        id: check
        run: |
          # Get latest commit SHA on main
          LATEST_SHA=$(curl -s "https://api.github.com/repos/SingularityCoding/phi/commits/main" | jq -r '.sha')

          # Read version from pyproject.toml at HEAD
          LATEST_VERSION=$(curl -sL "https://raw.githubusercontent.com/SingularityCoding/phi/main/pyproject.toml" \
            | grep '^version' | head -1 | grep -oP '"\K[^"]+'
          )

          # Read current values from formula
          CURRENT_VERSION=$(grep -oP '(?<=version ")[\d.]+' Formula/phi.rb | head -1)
          CURRENT_SHA=$(grep -oP '(?<=archive/)[0-9a-f]{40}' Formula/phi.rb | head -1)

          echo "latest_sha=$LATEST_SHA"         >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "current_sha=$CURRENT_SHA"        >> $GITHUB_OUTPUT

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $CURRENT_VERSION -> $LATEST_VERSION"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No version change ($CURRENT_VERSION). Skipping."
          fi

      - name: Download archive and compute SHA256
        if: steps.check.outputs.update_needed == 'true'
        id: sha
        run: |
          SHA="${{ steps.check.outputs.latest_sha }}"
          curl -sL "https://github.com/SingularityCoding/phi/archive/${SHA}.tar.gz" -o /tmp/phi.tar.gz
          SHA256=$(sha256sum /tmp/phi.tar.gz | awk '{print $1}')
          rm /tmp/phi.tar.gz
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update Formula/phi.rb
        if: steps.check.outputs.update_needed == 'true'
        env:
          LATEST_SHA: ${{ steps.check.outputs.latest_sha }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          python3 - <<'PYEOF'
          import os, re

          commit  = os.environ["LATEST_SHA"]
          version = os.environ["LATEST_VERSION"]
          sha256  = os.environ["SHA256"]

          with open("Formula/phi.rb") as f:
              content = f.read()

          # Update commit SHA in the URL
          content = re.sub(r'(archive/)[0-9a-f]{40}', rf'\g<1>{commit}', content)

          # Update version
          content = re.sub(r'version "[\d.]+"', f'version "{version}"', content)

          # Update sha256
          content = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha256}"', content)

          with open("Formula/phi.rb", "w") as f:
              f.write(content)

          print(open("Formula/phi.rb").read())
          PYEOF

      - name: Commit and push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/phi.rb
          git commit -m "Update phi formula to ${{ steps.check.outputs.latest_version }}"
          git push
