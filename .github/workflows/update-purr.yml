name: Update Purr Cask

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for new release
        id: release
        run: |
          RELEASE=$(curl -s https://api.github.com/repos/iamarunbrahma/purr/releases/latest)
          LATEST_TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          LATEST_VERSION="${LATEST_TAG#v}"
          DMG_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url')
          SHA_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | endswith(".sha256")) | .browser_download_url // empty')
          CURRENT_VERSION=$(grep -oP '(?<=version ")[^"]+' Casks/purr.rb)

          echo "latest=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "dmg_url=$DMG_URL" >> $GITHUB_OUTPUT
          echo "sha_url=$SHA_URL" >> $GITHUB_OUTPUT

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Already at $CURRENT_VERSION, nothing to do."
          fi

      - name: Compute SHA256
        if: steps.release.outputs.update_needed == 'true'
        id: sha
        run: |
          SHA_URL="${{ steps.release.outputs.sha_url }}"
          DMG_URL="${{ steps.release.outputs.dmg_url }}"

          if [ -n "$SHA_URL" ]; then
            SHA256=$(curl -sL "$SHA_URL" | awk '{print $1}')
          else
            curl -sL "$DMG_URL" -o purr.dmg
            SHA256=$(sha256sum purr.dmg | awk '{print $1}')
            rm purr.dmg
          fi

          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update Casks/purr.rb
        if: steps.release.outputs.update_needed == 'true'
        run: |
          VERSION="${{ steps.release.outputs.latest }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" Casks/purr.rb
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"$SHA256\"/" Casks/purr.rb
          cat Casks/purr.rb

      - name: Commit and push
        if: steps.release.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/purr.rb
          git commit -m "Update purr cask to ${{ steps.release.outputs.latest }}"
          git push
