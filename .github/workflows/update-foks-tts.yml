name: Update FOKS TTS Formula

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for a new release
        id: release
        run: |
          RELEASE=$(curl -fsS https://api.github.com/repos/soulhakr/foks-tts/releases/latest)
          LATEST_VERSION=$(echo "$RELEASE" | jq -r '.tag_name | ltrimstr("v")')
          CURRENT_VERSION=$(grep -oP '(?<=/download/v)[0-9.]+(?=/)' Formula/foks-tts.rb | head -1)
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST_VERSION" ] && [ "$LATEST_VERSION" != "null" ] && [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "Already at $CURRENT_VERSION, nothing to do."
          fi

      - name: Compute SHA256 of the release tarball
        if: steps.release.outputs.update_needed == 'true'
        id: sha
        run: |
          VERSION="${{ steps.release.outputs.latest }}"
          BASE="https://github.com/soulhakr/foks-tts/releases/download/v${VERSION}"
          curl -fsSL "$BASE/foks-tts-${VERSION}.tar.gz" -o /tmp/foks-tts.tar.gz
          SHA256=$(sha256sum /tmp/foks-tts.tar.gz | awk '{print $1}')
          # the release publishes its own checksum: they must agree
          PUBLISHED=$(curl -fsSL "$BASE/foks-tts-${VERSION}.tar.gz.sha256" | awk '{print $1}')
          if [ "$SHA256" != "$PUBLISHED" ]; then
            echo "Checksum mismatch: computed $SHA256, published $PUBLISHED" >&2
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update Formula/foks-tts.rb
        if: steps.release.outputs.update_needed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.latest }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          version, sha256 = os.environ["VERSION"], os.environ["SHA256"]
          text = open("Formula/foks-tts.rb").read()
          text = re.sub(r'(/download/v)[0-9.]+(/foks-tts-)[0-9.]+(\.tar\.gz)', rf'\g<1>{version}\g<2>{version}\g<3>', text, count=1)
          text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha256}"', text, count=1)
          open("Formula/foks-tts.rb", "w").write(text)
          PYEOF
          grep -n -E 'url |sha256' Formula/foks-tts.rb

      - name: Commit and push
        if: steps.release.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/foks-tts.rb
          git commit -m "Update foks-tts formula to ${{ steps.release.outputs.latest }}"
          git push
