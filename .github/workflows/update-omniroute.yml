name: Update OmniRoute Formula

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for new npm version
        id: check
        run: |
          LATEST_VERSION=$(curl -s "https://registry.npmjs.org/omniroute/latest" | jq -r '.version')
          CURRENT_VERSION=$(grep -oP '(?<=version ")[^"]+' Formula/omniroute.rb | head -1)

          echo "latest=$LATEST_VERSION"   >> $GITHUB_OUTPUT
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "New version: $LATEST_VERSION (current: $CURRENT_VERSION)"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Already at $CURRENT_VERSION, nothing to do."
          fi

      - name: Download tarball and compute SHA256
        if: steps.check.outputs.update_needed == 'true'
        id: sha
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          TARBALL_URL="https://registry.npmjs.org/omniroute/-/omniroute-${VERSION}.tgz"
          curl -sL "$TARBALL_URL" -o /tmp/omniroute.tgz
          SHA256=$(sha256sum /tmp/omniroute.tgz | awk '{print $1}')
          rm /tmp/omniroute.tgz
          echo "sha256=$SHA256"           >> $GITHUB_OUTPUT
          echo "tarball_url=$TARBALL_URL" >> $GITHUB_OUTPUT

      - name: Update Formula/omniroute.rb
        if: steps.check.outputs.update_needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          TARBALL_URL: ${{ steps.sha.outputs.tarball_url }}
        run: |
          python3 - <<'PYEOF'
          import os, re

          version     = os.environ["VERSION"]
          sha256      = os.environ["SHA256"]
          tarball_url = os.environ["TARBALL_URL"]

          with open("Formula/omniroute.rb") as f:
              content = f.read()

          # Update url
          content = re.sub(
              r'url "https://registry\.npmjs\.org/omniroute/-/omniroute-[^"]+\.tgz"',
              f'url "{tarball_url}"',
              content
          )

          # Update sha256
          content = re.sub(r'sha256 "[0-9a-f]+"', f'sha256 "{sha256}"', content)

          # Update version
          content = re.sub(r'version "[^"]+"', f'version "{version}"', content)

          with open("Formula/omniroute.rb", "w") as f:
              f.write(content)

          print(open("Formula/omniroute.rb").read())
          PYEOF

      - name: Commit and push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/omniroute.rb
          git commit -m "Update omniroute formula to ${{ steps.check.outputs.latest }}"
          git push
